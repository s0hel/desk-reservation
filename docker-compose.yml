# Local development stack. See TDD §3.1 — one `docker compose up` gives you
# Postgres, Redis and a mail catcher. The API runs on the host for fast reload.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deskflow_owner
      POSTGRES_PASSWORD: deskflow
      POSTGRES_DB: deskflow
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/api/scripts/init-roles.sql:/docker-entrypoint-initdb.d/10-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskflow_owner -d deskflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

volumes:
  pgdata:

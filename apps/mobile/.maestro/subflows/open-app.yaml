# Launch the app and sign in. Expected env: APP_ID, LAUNCH_URL, USER_EMAIL.
#
# *Which* app is under test differs by platform, and the runner decides rather than this
# flow: iOS has no dev build (Xcode 16.2 cannot compile SDK 57 — see CLAUDE.md), so the
# bundle is hosted by Expo Go and LAUNCH_URL is an `exp://` address; Android has a real
# dev build from `expo run:android`, and LAUNCH_URL is its own `deskflow://` deep link
# carrying the same Metro address. Keeping both in scripts/e2e.sh leaves everything here
# platform-agnostic except the one thing that genuinely is not: where the tokens live.
appId: ${APP_ID}
---
- stopApp

# Auth tokens are in expo-secure-store, which survives app relaunch. On iOS that is the
# Keychain, which survives `clearState` too — clearing app storage is NOT enough there,
# and a flow that skips this silently starts mid-session. On Android the same library
# uses app storage, so `clearState` does clear it and `clearKeychain` does not exist.
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
- runFlow:
    when:
      platform: Android
    commands:
      - clearState

- openLink: ${LAUNCH_URL}
- extendedWaitUntil:
    visible: "Sign in with your work email"
    # A cold start downloads the whole bundle from Metro.
    timeout: 120000

- tapOn: "Work email address"
# eraseText drops keystrokes. The field is a controlled TextInput, so every key
# round-trips through JS and the synthetic input outruns it: the deletes that get
# dropped stay in the field and reappear behind whatever is typed next (typing "zzz"
# over a field that looked empty produced "zzzcom"). The placeholder is not a reliable
# signal either — it showed while residue was still pending. Retyping until the value
# actually reads back is the only deterministic form. Originally found on iOS/XCUITest;
# kept for both, because the cause is the controlled input rather than the driver.
- repeat:
    times: 4
    while:
      notVisible: "${USER_EMAIL}"
    commands:
      - eraseText: 64
      - eraseText: 64
      - inputText: ${USER_EMAIL}
# A wait rather than a bare assert, for the same reason the retype loop exists: the
# value lands a beat after the last keystroke, and asserting on the instant the loop
# exits fails a field that is about to be correct.
- extendedWaitUntil:
    visible: "${USER_EMAIL}"
    timeout: 15000

# No hideKeyboard: this screen has no dismiss affordance and does not need one —
# KeyboardAvoidingView lifts the button clear of the keyboard.
- tapOn: "Continue"

# The home screen, once the week has actually loaded. The place in the greeting is the
# site's `short_name` off the API and the name is this user's, so this says the session
# works AND that the home site resolved (FR-1.9) — rather than merely that a screen
# rendered. It replaced an assertion on ".*BERLIN HQ.*", which was the old header's
# "TUESDAY · BERLIN HQ" eyebrow and no longer exists anywhere on this screen.
# Maestro matches the whole string, so the trailing wildcard is load-bearing.
- extendedWaitUntil:
    visible: "Welcome to Berlin, .*"
    timeout: 30000

# Launch the app and sign in. Expected env: EXPO_URL, USER_EMAIL.
appId: host.exp.Exponent
---
# Auth tokens live in the Keychain (expo-secure-store), which survives both app
# relaunch and `clearState` — clearing app storage is NOT enough to get back to a
# signed-out app, and a flow that skips this silently starts mid-session.
- stopApp
- clearKeychain

# There is no dev build (Xcode 16.2 cannot compile SDK 57 — see CLAUDE.md), so the
# app under test is a bundle served by Metro and hosted by Expo Go.
- openLink: ${EXPO_URL}
- extendedWaitUntil:
    visible: "Sign in with your work email"
    # A cold start downloads the whole bundle from Metro.
    timeout: 90000

- tapOn: "Work email address"
# eraseText drops keystrokes here. The field is a controlled TextInput, so every key
# round-trips through JS, and XCUITest outruns it: the deletes that get dropped stay in
# the field and reappear behind whatever is typed next (typing "zzz" over a field that
# looked empty produced "zzzcom"). The placeholder is not a reliable signal either —
# it showed while residue was still pending. Retyping until the value actually reads
# back is the only deterministic form. Synthetic-input artifact, not a product bug.
- repeat:
    times: 4
    while:
      notVisible: "${USER_EMAIL}"
    commands:
      - eraseText: 64
      - eraseText: 64
      - inputText: ${USER_EMAIL}
- assertVisible: "${USER_EMAIL}"

# No hideKeyboard: this screen has no dismiss affordance and does not need one —
# KeyboardAvoidingView lifts the button clear of the keyboard.
- tapOn: "Continue"

- extendedWaitUntil:
    visible: "Your bookings"
    timeout: 30000

# The golden path: find a free desk, book it, and cancel it again — leaving the seed
# data as it was found, so the flow can run repeatedly.
#
# Booking goes through the list view, where the target is addressable by accessibility
# label. The plan's own tap path is covered by 03-floor-plan.yaml.
appId: host.exp.Exponent
name: Book and cancel a desk
tags:
  - smoke
env:
  EXPO_URL: exp://127.0.0.1:8081
  USER_EMAIL: priya.raman@example.com
---
- runFlow: ../subflows/pick-open-day.yaml
- runFlow: ../subflows/open-app.yaml
- runFlow:
    file: ../subflows/clear-day.yaml
    env:
      DAY_ISO: ${output.dayIso}
- runFlow:
    file: ../subflows/open-floor.yaml
    env:
      DAY_LABEL: ${output.dayLabel}

- tapOn: "List view"
- extendedWaitUntil:
    visible: ".*desks free"
    timeout: 30000

# Take whichever desk is actually free rather than naming one, so a run does not
# depend on what previous runs left behind — then remember which it was, so every
# assertion below names that desk instead of "something got booked".
- copyTextFrom: ".*, Available"
- evalScript: ${output.desk = maestro.copiedText.split(',')[0]}
- tapOn: ".*, Available"

- assertVisible: "Booked"
- assertVisible: "${output.desk} on .*"
- tapOn: "OK"

# The list reflects the booking without a manual refresh — the mutation invalidates
# the availability query.
- assertVisible: "${output.desk}, Booked by you"

# The Today tab lists every booking from today onward (the client sends `from`, not a
# single date), so a booking made for a later weekday is cancellable here too.
# The header's back button, not Maestro's `back`: on iOS that is an edge swipe, and
# it reports success while doing nothing on this screen. "Spaces" matches the back
# button only — the tab reads "Spaces, tab, 2 of 3".
- tapOn: "Spaces"
- tapOn: "Today, tab.*"
- extendedWaitUntil:
    visible: "Cancel booking for ${output.desk} on .*"
    timeout: 30000
- tapOn: "Cancel booking for ${output.desk} on .*"

- assertVisible: "Cancel booking?"
# Anchored: the confirmation's title is "Cancel booking?" and its button is
# "Cancel booking".
- tapOn: "^Cancel booking$"
- extendedWaitUntil:
    notVisible: "Cancel booking for ${output.desk} on .*"
    timeout: 30000
